# XREAD Experiment Configuration

# Pathology labels (14 CheXpert conditions)
pathologies:
  - No Finding
  - Enlarged Cardiomediastinum
  - Cardiomegaly
  - Lung Opacity
  - Lung Lesion
  - Edema
  - Consolidation
  - Pneumonia
  - Atelectasis
  - Pneumothorax
  - Pleural Effusion
  - Pleural Other
  - Fracture
  - Support Devices

# Uncertainty strategies
strategies:
  - u_zeros
  - u_ones
  - u_ignore
  - u_llm

# Model types
models:
  - naive
  - classical
  - radbert

# Data paths
data:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: data/outputs
  chexpert_plus_csv: data/raw/df_chexpert_plus_240401.csv
  chexbert_labels_json: data/raw/chexbert_labels/findings_fixed.json
  groundtruth_csv: data/raw/groundtruth.csv
  kaggle_images_dir: data/raw/CheXpert-v1.0-small

# Data processing
processing:
  test_size: 0.1
  val_size: 0.1
  random_seed: 42

# TF-IDF features
tfidf:
  max_features: 10000
  ngram_range: [1, 2]
  sublinear_tf: true
  vectorizer_path: models/tfidf_vectorizer.pkl

# Classical ML (Logistic Regression)
classical:
  class_weight: balanced
  max_iter: 1000
  solver: lbfgs

# RadBERT
radbert:
  model_name: StanfordAIMI/RadBERT
  max_length: 512
  batch_size: 32
  learning_rate: 2.0e-5
  num_epochs: 5
  dropout: 0.1
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true
  early_stopping_patience: 2

# Ollama LLM uncertainty resolution
ollama:
  base_url: http://localhost:11434
  model: qwen3-coder:30b
  temperature: 0
  num_predict: 5
  checkpoint_interval: 100
  checkpoint_dir: data/processed/ollama_checkpoints

# Evaluation
evaluation:
  threshold: 0.5
  bootstrap_n_iterations: 1000
  bootstrap_seed: 42
  n_error_examples: 5

# Gradio app
app:
  title: "XREAD: Radiology Report Pathology Classifier"
  share: false
  server_port: 7860
